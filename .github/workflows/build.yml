name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockNumber-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Keeps a ready-to-install APK sitting on the repo's Releases page at all times,
      # instead of only inside an Actions artifact (which expires and needs a GitHub login).
      - name: Publish APK to the "latest" release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" block-number.apk

          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILT=$(date -u '+%Y-%m-%d %H:%M UTC')
          SIZE=$(du -h block-number.apk | cut -f1)

          {
            printf 'Debug build, %s — commit `%s`, built %s\n\n' "$SIZE" "$SHORT_SHA" "$BUILT"
            printf 'Replaced automatically on every push to the default branch.\n'
          } > release-notes.md

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Block Number (latest build)" --notes-file release-notes.md
          else
            gh release create latest --title "Block Number (latest build)" --notes-file release-notes.md
          fi

          gh release upload latest block-number.apk --clobber
